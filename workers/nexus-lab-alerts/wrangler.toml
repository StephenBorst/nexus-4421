name = "nexus-lab-alerts"
main = "index.js"
compatibility_date = "2024-01-01"

# Cron: runs every minute
[triggers]
crons = ["* * * * *"]

# Shared with nexus-lab-api — same KV namespace ID
[[kv_namespaces]]
binding = "LAB_STORE"
id = "12c4fcbc04cc4211902d49b8abc2a751"

# Separate namespace for wallet→chatId mappings
[[kv_namespaces]]
binding = "ALERT_STORE"
id = "c3d24940521b4abbb43d1535a75fe976"
