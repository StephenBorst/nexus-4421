name = "nexus-carry-engine"
main = "index.js"
compatibility_date = "2024-09-23"

# Two crons: hourly runs the PAPER record (accrues funding, marks, 24h rebalance); the
# */5 runs the LIVE maker re-quote (chases fills) — a no-op unless CARRY_LIVE=true. Live
# re-ranks the target only every CARRY_REBAL_H; the fast tick just chases fills toward it.
[triggers]
crons = ["0 * * * *", "*/5 * * * *"]

# KV namespace (created 2026-08-18). Reuse across deploys; state lives at key carry:state.
[[kv_namespaces]]
binding = "CARRY"
id = "b34f3af62cfe4bc2b5d03ce9c7b55868"

[vars]
CARRY_MODE = "paper"        # paper only in this worker; the live maker executor is separate
CARRY_CAPITAL = "1000"
CARRY_PERSIDE = "1"          # the validated carry-dominant setting (RV-v4)
CARRY_REBAL_H = "24"
CARRY_MAKER_BPS = "-0.1"     # maker rebate; the sleeve is not deployable on taker fees

[observability.logs]
enabled = true

# Optional ops secret to gate POST /carry/tick and /carry/reset:
#   npx wrangler secret put CARRY_ADMIN_TOKEN
# Sent as the x-carry-token header (never a query string). If unset, those POSTs are open —
# set it before deploy.
