<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexus Trading Labs</title>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tint mobile browser chrome / safe-area insets to the app background so
         there's no contrasting dark band above the (wallet) browser toolbar. -->
    <meta name="theme-color" content="#0a0e0a" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="msapplication-TileColor" content="#000000" />
    <style>
      html, body { margin: 0; background: #0a0e0a; }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/favicon.webp" />
    <meta property="og:title" content="Nexus Trading Labs" />
    <meta property="og:description" content="Non-custodial Perpetual DEX on Arbitrum. Trade crypto, RWAs, and equities on-chain." />
    <meta property="og:image" content="https://trade.nexustradinglabs.com/embed-mini.png" />
    <meta property="og:url" content="https://trade.nexustradinglabs.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus Trading Labs" />
    <meta name="twitter:description" content="Non-custodial Perpetual DEX on Arbitrum. Trade crypto, RWAs, and equities on-chain." />
    <meta name="twitter:image" content="https://trade.nexustradinglabs.com/embed-mini.png" />

    <!-- Farcaster Mini App embed — makes a cast of any Nexus link render a "Launch" button
         into /mini. Crawler reads static HTML, so this lives here (not per-route JS). -->
    <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://trade.nexustradinglabs.com/embed-mini.png","button":{"title":"⚡ Trade Perps","action":{"type":"launch_miniapp","name":"Nexus Trading Labs","url":"https://trade.nexustradinglabs.com/mini","splashImageUrl":"https://trade.nexustradinglabs.com/icon-512.png","splashBackgroundColor":"#0a0e0a"}}}' />
    <!-- Backward-compat alias for older clients that still read fc:frame/launch_frame. -->
    <meta name="fc:frame" content='{"version":"1","imageUrl":"https://trade.nexustradinglabs.com/embed-mini.png","button":{"title":"⚡ Trade Perps","action":{"type":"launch_frame","name":"Nexus Trading Labs","url":"https://trade.nexustradinglabs.com/mini","splashImageUrl":"https://trade.nexustradinglabs.com/icon-512.png","splashBackgroundColor":"#0a0e0a"}}}' />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
