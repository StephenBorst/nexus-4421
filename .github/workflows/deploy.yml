name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          sudo fallocate -l 4G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install -g yarn && yarn install --frozen-lockfile

      - name: Build
        run: yarn tsx scripts/generate-manifest.ts && yarn vite build --no-minify && yarn tsx scripts/generate-manifest.ts
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Create Pages project (if not exists)
        run: npx wrangler@3 pages project create nexus-trading-lab --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy build/client --project-name=nexus-trading-lab --branch=main --commit-dirty=true

      - name: Deploy Worker (nexus-lab-api)
        working-directory: workers/nexus-lab-api
        run: npm ci && npx wrangler@3 deploy
