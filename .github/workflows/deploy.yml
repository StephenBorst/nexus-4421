name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          # GitHub runners now ship an active /mnt/swapfile, so `fallocate` on it fails
          # with "Text file busy". Skip if we already have enough swap; otherwise create
          # our own under a unique name. Never fail the build over swap setup.
          set +e
          CUR=$(free -m | awk '/Swap/{print $2}')
          echo "Existing swap: ${CUR}MB"
          if [ "${CUR:-0}" -ge 4000 ]; then
            echo "Swap already >= 4G — skipping."
          else
            sudo fallocate -l 4G /mnt/nexus-swapfile \
              && sudo chmod 600 /mnt/nexus-swapfile \
              && sudo mkswap /mnt/nexus-swapfile \
              && sudo swapon /mnt/nexus-swapfile
            echo "swap setup exit: $? (non-fatal)"
          fi
          free -m
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          corepack enable
          n=0
          until [ "$n" -ge 3 ]; do
            yarn install --frozen-lockfile && exit 0
            n=$((n+1))
            echo "::warning::yarn install failed (attempt $n/3) — retrying in 10s"
            sleep 10
          done
          echo "::error::yarn install failed after 3 attempts"
          exit 1

      - name: Build
        run: yarn tsx scripts/generate-manifest.ts && yarn vite build --no-minify && yarn tsx scripts/generate-manifest.ts
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Create Pages project (if not exists)
        run: npx wrangler@3 pages project create nexus-trading-lab --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy build/client --project-name=nexus-trading-lab --branch=main --commit-dirty=true

      - name: Deploy Worker (nexus-lab-api)
        working-directory: workers/nexus-lab-api
        run: npm ci && npx wrangler@3 deploy
